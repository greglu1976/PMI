[settings_general]
fbs = ['LVTTOC', 'LVRBVTR', 'TOFFLVLGC', 'T_LVALH', 'T_LVARCTOC', 'TTOCLGC_UIRZ']

[kzn_modes]
heading = Проверка функции КЦН НН
intro_text = Так как функциональный блок КЦН НН связан только с ФБ МТЗ и сигнализацией, то правильность его функционирования проверяется вместе с ФБ МТЗ. Для проверки функции КЦН НН предусматривается 11 режимов. Перечень подаваемых воздействий для каждого режима приводится в таблице XXX. Задаваемые уставки функций, необходимых для проверок, для каждого из режимов приведены в таблицах п.ХХХ – п.ХХХ. Функции, не участвующие в данных проверках, необходимо вывести из работы.
needed_inputs = fsu_kzn_needed_inputs.json
needed_outputs = fsu_kzn_needed_outputs.json
result_heading = Результат проверки функции КЦН НН
result_text = Проверка производится в соответствии с пунктом ХХХ данной программы. При проверке контролируется прохождение сигналов (на выходных реле – таблица ХХХ, в журнале текущих событий и осциллограмме) в соответствии с таблицей ХХХ. При этом по журналу событий контролируется появление ложных сигналов ФСУ при проведении данных опытов.
setting_heading = Параметры для проверки функции КЦН НН

