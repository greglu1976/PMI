[settings_general]
fbs = ['T2_LVTTOC', 'LVRBVTR1', 'LVRBVTR2', 'TRESOFFLVLGC', 'T2_LVALH', 'T_LVARCTOC', 'T2_TTOCLGC_UIRZ']

[kzn_modes]
heading = Проверка функций КЦН НН1, КЦН НН2
intro_text = Так как функциональные блоки КЦН НН1 и КЦН НН2 связаны только с ФБ МТЗ и сигнализацией, то правильность их функционирования проверяется вместе с ФБ МТЗ. Для проверки функций КЦН НН1 и КЦН НН2 предусматривается 21 режим. Перечень подаваемых воздействий для каждого режима приводится в таблице XXX. Задаваемые уставки функций, необходимых для проверок, для каждого из режимов приведены в таблицах п.ХХХ – п.ХХХ. Функции, не участвующие в данных проверках, необходимо вывести из работы.
needed_inputs = fsu_kzn_needed_inputs.json
needed_outputs = fsu_kzn_needed_outputs.json
result_heading = Результат проверки функций КЦН НН1, КЦН НН2
result_text = Проверка производится в соответствии с пунктом ХХХ данной программы. При проверке контролируется прохождение сигналов (на выходных реле – таблица ХХХ, в журнале текущих событий и осциллограмме) в соответствии с таблицей ХХХ. При этом по журналу событий контролируется появление ложных сигналов ФСУ при проведении данных опытов.
setting_heading = Параметры для проверки функций КЦН НН1, КЦН НН2

