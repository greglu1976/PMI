[settings_general]
fbs = ['T2_TOVCTOC', 'LTCBLKTOC', 'LVNSTOC', 'TOFFLVLGC', 'T_LVTOC', 'T_LVARCTOC', 'TTOCLGC_UIRZ']

[lzt_modes]
heading = Проверка функции ЛЗТ
intro_text = Для проверки функции ЛЗТ предусматривается 5 режимов. Проверка пусков от ступеней МТЗ описана в разделе МТЗ. Перечень подаваемых воздействий для каждого режима приводится в таблице XXX. Задаваемые уставки функций, необходимых для проверок, для каждого из режимов приведены в таблицах п.ХХХ – п.ХХХ. Функции, не участвующие в данных проверках, необходимо вывести из работы.
needed_inputs = fsu_lzt_needed_inputs.json
needed_outputs = fsu_lzt_needed_outputs.json
result_heading = Результат проверки функции ЛЗТ
result_text = Проверка производится в соответствии с пунктом ХХХ данной программы. При проверке контролируется прохождение сигналов (на выходных реле – таблица ХХХ, в журнале текущих событий и осциллограмме) в соответствии с таблицей ХХХ. При этом по журналу событий контролируется появление ложных сигналов ФСУ при проведении данных опытов.
setting_heading = Параметры для проверки функции ЛЗТ

